services:
  - type: web
    name: sabor-sinu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*" --no-access-log --timeout-keep-alive 5
    healthCheckPath: /api/health
    # Los despliegues los dispara .github/workflows/deploy.yml con un Deploy
    # Hook. Así no dependemos del webhook automático de Render, que falló.
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: ENVIRONMENT
        value: production
      # Límite por IP; con proxy headers cada cliente tiene su propio cupo.
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: ADMIN_TOKEN
        generateValue: true
      # Ruta privada del panel. Sin esto, queda en /admin.
      - key: ADMIN_PANEL_PATH
        sync: false
      # Datos de ejemplo: cámbialos en el panel de Render.
      - key: BUSINESS_NAME
        value: Sabor Sinú
      - key: BUSINESS_PHONE
        value: "+57 304 466 7353"
      - key: BUSINESS_WHATSAPP
        value: "573044667353"
      - key: BUSINESS_NEQUI
        value: "304 466 7353"
      - key: BUSINESS_LLAVE
        value: "304 466 7353"
      - key: BUSINESS_ADDRESS
        value: "Calle 34 # 6-12, Centro, Montería, Córdoba"
      # Secretos: Render los pedirá al crear el servicio (sync: false).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: EMAIL_DRY_RUN
        value: "false"
      - key: WHATSAPP_ALERT_PHONE
        value: "573044667353"
      - key: CALLMEBOT_API_KEY
        sync: false
      # Stock persistente gratis (Upstash Redis). Sin esto, el stock se
      # reinicia cuando Render duerme el servicio.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
