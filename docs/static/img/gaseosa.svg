  <text x="400" y="425" font-size="250" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji">🥤</text>
  <text x="400" y="552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" letter-spacing="6" fill="#fdf6e8" opacity=".92">GASEOSA 400 ML</text>
