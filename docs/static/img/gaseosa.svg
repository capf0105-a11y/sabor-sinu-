      <stop offset="0" stop-color="#082f49"/>
      <stop offset=".55" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
