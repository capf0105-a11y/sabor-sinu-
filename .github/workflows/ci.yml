name: Pruebas automáticas

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Todos los días a las 09:00 UTC (04:00 a. m. en Colombia).
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: |
          set +e
          python -m pytest -q --tb=short -ra > pytest.log 2>&1
          status=$?
          cat pytest.log
          if [ "$status" -ne 0 ]; then
            grep -E "^FAILED|^ERROR" pytest.log | head -n 20 | while IFS= read -r line; do
              echo "::error title=Prueba fallida::$line"
            done
            echo "## ❌ Las pruebas fallaron" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 pytest.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Crear issue si fallan las pruebas programadas
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title | startswith("🧪 Pruebas automáticas fallaron")) | .number' \
            | head -n 1 || true)
          if [ -z "$existing" ]; then
            gh issue create \
              --title "🧪 Pruebas automáticas fallaron" \
              --body "Las pruebas programadas fallaron. Revisa el run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Cerrar issue si las pruebas volvieron a pasar
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title | startswith("🧪 Pruebas automáticas fallaron")) | .number' \
            | head -n 1 || true)
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Las pruebas automáticas volvieron a pasar."
          fi
