<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Suizo con Lomito Monteriano">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1d0e"/>
      <stop offset=".55" stop-color="#8a3d12"/>
      <stop offset="1" stop-color="#e08a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="26" height="26" fill="none"/>
      <rect width="10" height="26" fill="#ffffff" opacity=".035"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#lines)"/>
  <circle cx="675" cy="105" r="150" fill="#ffffff" opacity=".06"/>
  <circle cx="115" cy="510" r="170" fill="#000000" opacity=".10"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <ellipse cx="400" cy="486" rx="248" ry="52" fill="#000" opacity=".22"/>
  <ellipse cx="400" cy="438" rx="236" ry="64" fill="#fdf6e8" opacity=".94"/>
  <ellipse cx="400" cy="432" rx="196" ry="48" fill="#efe2ca" opacity=".8"/>
  <text x="400" y="425" font-size="250" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji">🌭</text>
  <text x="400" y="552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" letter-spacing="6" fill="#fdf6e8" opacity=".92">SUIZO MONTERIANO</text>
</svg>
